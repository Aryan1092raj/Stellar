name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Block unsafe production email config
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          DISABLE_EMAILS: ${{ secrets.DISABLE_EMAILS }}
        run: |
          if [ "$NODE_ENV" = "production" ] && [ "$DISABLE_EMAILS" = "1" ]; then
            echo "DISABLE_EMAILS=1 is not allowed when NODE_ENV=production"
            exit 1
          fi
      - name: Run Prisma migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build functions
        working-directory: functions
        run: |
          npm ci
          npm run build
